name: Build Kernel with SukiSU-Ultra & Repack boot.img

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: "Kernel source repository URL"
        required: true
        default: "https://github.com/PixelExperience-Devices/kernel_xiaomi_lisa"
      KERNEL_BRANCH:
        description: "Kernel source branch"
        required: true
        default: "thirteen"
      KERNEL_DEFCONFIG:
        description: "Defconfig file"
        required: true
        default: "lisa_defconfig"
      SUKISU_BRANCH:
        description: "SukiSU-Ultra branch"
        required: true
        default: "main"
      HOOK_METHOD:
        description: "Hook method"
        required: true
        default: "manual"
        type: choice
        options:
          - kprobe
          - manual
      ENABLE_KPM:
        description: "Enable KPM (Kernel Patch Module)"
        required: false
        default: true
        type: boolean
      DISABLE_LTO:
        description: "Disable LTO"
        required: false
        default: false
        type: boolean
      STOCK_BOOT_URL:
        description: "Stock boot.img URL for repacking"
        required: true
        default: "https://github.com/tungnt017/build-kernel-sukisu/releases/download/2.0/boot.img"

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel & Repack boot.img
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ──────────────────────────────────────────────
      # 1. Install build dependencies
      # ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3 \
            wget cpio

      # ──────────────────────────────────────────────
      # 2. Setup ccache for faster rebuilds
      # ──────────────────────────────────────────────
      - name: Setup ccache
        run: |
          ccache -M 10G
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      # ──────────────────────────────────────────────
      # 3. Clone kernel source
      # ──────────────────────────────────────────────
      - name: Clone Kernel Source
        run: |
          git clone --depth=1 \
            -b ${{ github.event.inputs.KERNEL_BRANCH }} \
            ${{ github.event.inputs.KERNEL_SOURCE }} \
            kernel_source

      # ──────────────────────────────────────────────
      # 4. Clone SukiSU-Ultra into kernel tree
      # ──────────────────────────────────────────────
      - name: Clone SukiSU-Ultra
        run: |
          cd kernel_source
          git clone --depth=1 \
            -b ${{ github.event.inputs.SUKISU_BRANCH }} \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git \
            KernelSU
          # Create symlink so the build system picks it up
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu

      # ──────────────────────────────────────────────
      # 5. Setup SukiSU-Ultra (hook method, KPM, LTO)
      # ──────────────────────────────────────────────
      - name: Setup SukiSU-Ultra
        run: |
          cd kernel_source

          # ── Add kernelsu to drivers Makefile ──
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

          # ── Apply hook method patches ──
          HOOK="${{ github.event.inputs.HOOK_METHOD }}"
          if [ "$HOOK" = "manual" ]; then
            echo "[*] Applying manual hook patches..."
            # Apply the SukiSU manual hook patches if available
            if [ -f KernelSU/kernel/setup.sh ]; then
              bash KernelSU/kernel/setup.sh
            fi
            # Enable manual hook in defconfig
            echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}
          else
            echo "[*] Using kprobe hook method..."
            echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}
            echo "CONFIG_KPROBES=y" >> arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}
            echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}
            echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}
          fi

          # ── Enable KPM if requested ──
          if [ "${{ github.event.inputs.ENABLE_KPM }}" = "true" ]; then
            echo "[*] Enabling KPM (Kernel Patch Module)..."
            echo "CONFIG_KPM=y" >> arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}
            echo "CONFIG_MODULES=y" >> arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}
            echo "CONFIG_MODULE_UNLOAD=y" >> arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}
          fi

          # ── Disable LTO if requested ──
          if [ "${{ github.event.inputs.DISABLE_LTO }}" = "true" ]; then
            echo "[*] Disabling LTO..."
            sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}
            sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}
            sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}
            echo "CONFIG_LTO_NONE=y" >> arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}
          fi

      # ──────────────────────────────────────────────
      # 6. Setup Clang toolchain
      # ──────────────────────────────────────────────
      - name: Setup Clang Toolchain
        run: |
          mkdir -p ~/clang
          # Download Neutron Clang (widely used for Android kernel builds)
          CLANG_URL="https://raw.githubusercontent.com/nicholaschum/magiskboot_build/main/.github/workflows/build.yml"
          # Use ZyC clang or AOSP clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r498229b.tar.gz -O ~/clang/clang.tar.gz || true

          # Fallback: use system clang + GCC cross-compiler
          if [ ! -f ~/clang/clang.tar.gz ] || [ ! -s ~/clang/clang.tar.gz ]; then
            echo "[*] Using system clang toolchain..."
            sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu
            echo "USE_SYSTEM_CLANG=true" >> $GITHUB_ENV
          else
            tar -xzf ~/clang/clang.tar.gz -C ~/clang/
            echo "USE_SYSTEM_CLANG=false" >> $GITHUB_ENV
          fi

          # Also get GCC cross-compiler
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # ──────────────────────────────────────────────
      # 7. Build the kernel
      # ──────────────────────────────────────────────
      - name: Build Kernel
        run: |
          cd kernel_source

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          if [ "$USE_SYSTEM_CLANG" = "true" ]; then
            export CC=clang
            export LD=ld.lld
          else
            export PATH="$HOME/clang/bin:$PATH"
            export CC=clang
            export LD=ld.lld
          fi

          # Generate defconfig
          make O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            ${{ github.event.inputs.KERNEL_DEFCONFIG }}

          # Build kernel
          make O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            -j$(nproc --all)

          # Verify kernel image was built
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image" >> $GITHUB_ENV
            echo "[✓] Kernel Image built successfully!"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz" >> $GITHUB_ENV
            echo "[✓] Kernel Image.gz built successfully!"
          elif [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz-dtb" >> $GITHUB_ENV
            echo "[✓] Kernel Image.gz-dtb built successfully!"
          else
            echo "[✗] Kernel build failed! No Image found."
            ls -la out/arch/arm64/boot/ || true
            exit 1
          fi

      # ──────────────────────────────────────────────
      # 8. Download stock boot.img
      # ──────────────────────────────────────────────
      - name: Download Stock boot.img
        run: |
          wget -q "${{ github.event.inputs.STOCK_BOOT_URL }}" -O stock_boot.img
          echo "[✓] Downloaded stock boot.img ($(stat -c%s stock_boot.img) bytes)"

      # ──────────────────────────────────────────────
      # 9. Download magiskboot (Linux x86_64)
      # ──────────────────────────────────────────────
      - name: Download magiskboot
        run: |
          # Try multiple sources for magiskboot Linux binary
          MAGISKBOOT_URL="https://github.com/nicholaschum/magiskboot_build/releases/latest/download/magiskboot-x86_64"
          wget -q "$MAGISKBOOT_URL" -O magiskboot || {
            echo "[*] Trying alternative magiskboot source..."
            # Alternative: build from topjohnwu's Magisk or use another prebuilt
            MAGISKBOOT_URL2="https://github.com/nicholaschum/magiskboot_build/releases/download/v30.0/magiskboot-x86_64"
            wget -q "$MAGISKBOOT_URL2" -O magiskboot
          }
          chmod +x magiskboot
          echo "[✓] magiskboot ready"
          ./magiskboot || true

      # ──────────────────────────────────────────────
      # 10. Unpack stock boot.img
      # ──────────────────────────────────────────────
      - name: Unpack Stock boot.img
        run: |
          mkdir -p workdir
          cp stock_boot.img workdir/
          cp magiskboot workdir/
          cd workdir

          ./magiskboot unpack stock_boot.img
          echo ""
          echo "[✓] Unpacked boot.img components:"
          ls -la

      # ──────────────────────────────────────────────
      # 11. Replace kernel in unpacked boot
      # ──────────────────────────────────────────────
      - name: Replace Kernel
        run: |
          cd workdir

          # Back up original kernel
          if [ -f kernel ]; then
            cp kernel kernel.orig
            echo "[*] Original kernel size: $(stat -c%s kernel) bytes"
          fi

          # Copy newly built kernel image
          cp ../kernel_source/${{ env.KERNEL_IMAGE }} kernel
          echo "[✓] Replaced kernel with custom build ($(stat -c%s kernel) bytes)"

      # ──────────────────────────────────────────────
      # 12. Repack boot.img using magiskboot
      # ──────────────────────────────────────────────
      - name: Repack boot.img
        run: |
          cd workdir

          ./magiskboot repack stock_boot.img new-boot.img
          echo ""
          echo "[✓] Repacked boot.img successfully!"
          echo "    Original: $(stat -c%s stock_boot.img) bytes"
          echo "    New:      $(stat -c%s new-boot.img) bytes"

          # Copy to workspace root for artifact upload
          cp new-boot.img ../new-boot.img

      # ──────────────────────────────────────────────
      # 13. Upload boot.img as GitHub Actions artifact
      # ──────────────────────────────────────────────
      - name: Upload boot.img Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-img-sukisu-${{ github.run_number }}
          path: new-boot.img
          retention-days: 7

      # ──────────────────────────────────────────────
      # 14. Create GitHub Release with the new boot.img
      # ──────────────────────────────────────────────
      - name: Generate Release Tag
        run: |
          echo "RELEASE_TAG=v$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
          echo "RELEASE_DATE=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "SukiSU-Ultra Kernel Boot Image - ${{ env.RELEASE_DATE }}"
          body: |
            ## 🔧 Build Configuration
            | Setting | Value |
            |---------|-------|
            | **Kernel Source** | `${{ github.event.inputs.KERNEL_SOURCE }}` |
            | **Branch** | `${{ github.event.inputs.KERNEL_BRANCH }}` |
            | **Defconfig** | `${{ github.event.inputs.KERNEL_DEFCONFIG }}` |
            | **SukiSU Branch** | `${{ github.event.inputs.SUKISU_BRANCH }}` |
            | **Hook Method** | `${{ github.event.inputs.HOOK_METHOD }}` |
            | **KPM Enabled** | `${{ github.event.inputs.ENABLE_KPM }}` |
            | **LTO Disabled** | `${{ github.event.inputs.DISABLE_LTO }}` |
            | **Stock boot.img** | `${{ github.event.inputs.STOCK_BOOT_URL }}` |

            ## 📦 Files
            - `new-boot.img` — Repacked boot image with SukiSU-Ultra kernel

            ## 🚀 Flash Instructions
            ```bash
            fastboot flash boot new-boot.img
            ```
          files: new-boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
