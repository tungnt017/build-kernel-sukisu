name: Build Kernel with SukiSU-Ultra & Repack boot.img

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: "Kernel source repository URL"
        required: true
        default: "https://github.com/PixelExperience-Devices/kernel_xiaomi_lisa"
      KERNEL_BRANCH:
        description: "Kernel source branch"
        required: true
        default: "thirteen"
      KERNEL_DEFCONFIG:
        description: "Defconfig file"
        required: true
        default: "lisa_defconfig"
      SUKISU_BRANCH:
        description: "SukiSU-Ultra branch"
        required: true
        default: "main"
      ENABLE_KPM:
        description: "Enable KPM (Kernel Patch Module)"
        required: false
        default: true
        type: boolean
      DISABLE_LTO:
        description: "Disable LTO"
        required: false
        default: false
        type: boolean
      STOCK_BOOT_URL:
        description: "Stock boot.img URL for repacking"
        required: true
        default: "https://github.com/tungnt017/build-kernel-sukisu/releases/download/2.0/boot.img"

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel & Repack boot.img
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install build dependencies
      # ============================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            flex git kmod libelf-dev libssl-dev lld llvm \
            make python3 unzip wget zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      # ============================================================
      # 3. Setup Clang toolchain
      # ============================================================
      - name: Setup Clang toolchain
        run: |
          mkdir -p toolchain/clang
          git clone --depth=1 https://gitlab.com/AyushR1/proton-clang.git toolchain/clang || \
          git clone --depth=1 https://github.com/AyushR1/proton-clang-18.git toolchain/clang
          echo "Clang version:"
          toolchain/clang/bin/clang --version || echo "WARNING: Clang setup may have failed"

      # ============================================================
      # 4. Clone kernel source
      # ============================================================
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            -b ${{ github.event.inputs.KERNEL_BRANCH }} \
            ${{ github.event.inputs.KERNEL_SOURCE }} \
            kernel_source
          echo "✅ Kernel source cloned"
          head -5 kernel_source/Makefile

      # ============================================================
      # 5. Integrate SukiSU-Ultra (add source tree)
      # ============================================================
      - name: Integrate SukiSU-Ultra
        run: |
          cd kernel_source
          echo "========== Integrating SukiSU-Ultra (${{ github.event.inputs.SUKISU_BRANCH }}) =========="
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s ${{ github.event.inputs.SUKISU_BRANCH }}
          echo "✅ SukiSU-Ultra source tree integrated"
          ls -la KernelSU/ 2>/dev/null || ls -la drivers/kernelsu/ 2>/dev/null || echo "Check KernelSU directory"

      # ============================================================
      # 6. Apply manual hook patches (NOT kprobe)
      # ============================================================
      - name: Apply manual hook patches
        run: |
          cd kernel_source
          echo "========== Applying manual hook patches for non-GKI kernel =========="

          # ----------------------------------------------------------
          # Find defconfig path
          # ----------------------------------------------------------
          DEFCONFIG="arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}"
          if [ ! -f "$DEFCONFIG" ]; then
            DEFCONFIG="arch/arm64/configs/vendor/${{ github.event.inputs.KERNEL_DEFCONFIG }}"
          fi
          echo "Using defconfig: $DEFCONFIG"

          # ----------------------------------------------------------
          # Add KSU + manual hook configs to defconfig
          # ----------------------------------------------------------
          echo "" >> "$DEFCONFIG"
          echo "# KernelSU (SukiSU-Ultra) manual hook" >> "$DEFCONFIG"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"
          echo "✅ CONFIG_KSU=y and CONFIG_KSU_MANUAL_HOOK=y added to defconfig"

          # ==========================================================
          # PATCH 1: fs/exec.c - Hook do_execveat_common
          # ==========================================================
          echo "--- Patching fs/exec.c ---"
          EXEC_FILE="fs/exec.c"

          # Add extern declarations before do_execveat_common
          sed -i '/^static int do_execveat_common/i \
          #ifdef CONFIG_KSU\
          extern bool ksu_execveat_hook __read_mostly;\
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,\
          \t\t\tvoid *envp, int *flags);\
          extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,\
          \t\t\t\t void *argv, void *envp, int *flags);\
          #endif' "$EXEC_FILE"
          
                    # Add hook call inside do_execveat_common after struct linux_binprm
                    sed -i '/do_execveat_common/,/struct linux_binprm/{
                      /struct linux_binprm/a \
          #ifdef CONFIG_KSU\
          \tif (unlikely(ksu_execveat_hook))\
          \t\tksu_handle_execveat(\&fd, \&filename, \&argv, \&envp, \&flags);\
          \telse\
          \t\tksu_handle_execveat_sucompat(\&fd, \&filename, \&argv, \&envp, \&flags);\
          #endif
                    }' "$EXEC_FILE"
          
                    grep -n "CONFIG_KSU" "$EXEC_FILE" && echo "✅ fs/exec.c patched" || echo "❌ fs/exec.c patch FAILED"
          
                    # ==========================================================
                    # PATCH 2: fs/open.c - Hook do_faccessat
                    # ==========================================================
                    echo "--- Patching fs/open.c ---"
                    OPEN_FILE="fs/open.c"
          
                    sed -i '/^long do_faccessat\|^int do_faccessat\|^static long do_faccessat/i \
          #ifdef CONFIG_KSU\
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,\
          \t\t\t        int *flags);\
          #endif' "$OPEN_FILE"
          
                    # Fallback: try SYSCALL_DEFINE3(faccessat
                    if ! grep -q "ksu_handle_faccessat" "$OPEN_FILE"; then
                      sed -i '/SYSCALL_DEFINE3(faccessat/i \
          #ifdef CONFIG_KSU\
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,\
          \t\t\t        int *flags);\
          #endif' "$OPEN_FILE"
                    fi
          
                    # Add hook call after LOOKUP_FOLLOW
                    sed -i '/do_faccessat\|SYSCALL_DEFINE3(faccessat/{
                      /LOOKUP_FOLLOW/a \
          #ifdef CONFIG_KSU\
          \tksu_handle_faccessat(\&dfd, \&filename, \&mode, NULL);\
          #endif
                    }' "$OPEN_FILE"
          
                    grep -n "ksu_handle_faccessat" "$OPEN_FILE" && echo "✅ fs/open.c patched" || echo "❌ fs/open.c patch FAILED"
          
                    # ==========================================================
                    # PATCH 3: fs/read_write.c - Hook vfs_read
                    # ==========================================================
                    echo "--- Patching fs/read_write.c ---"
                    RW_FILE="fs/read_write.c"
          
                    sed -i '/^ssize_t vfs_read/i \
          #ifdef CONFIG_KSU\
          extern bool ksu_vfs_read_hook __read_mostly;\
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,\
          \t\t\tsize_t *count_ptr, loff_t **pos);\
          #endif' "$RW_FILE"
          
                    sed -i '/^ssize_t vfs_read/,/if (!(file->f_mode & FMODE_READ))/{
                      /if (!(file->f_mode & FMODE_READ))/i \
          #ifdef CONFIG_KSU\
          \tif (unlikely(ksu_vfs_read_hook))\
          \t\tksu_handle_vfs_read(\&file, \&buf, \&count, \&pos);\
          #endif
                    }' "$RW_FILE"
          
                    grep -n "ksu_handle_vfs_read" "$RW_FILE" && echo "✅ fs/read_write.c patched" || echo "❌ fs/read_write.c patch FAILED"
          
                    # ==========================================================
                    # PATCH 4: fs/stat.c - Hook vfs_statx or vfs_fstatat
                    # ==========================================================
                    echo "--- Patching fs/stat.c ---"
                    STAT_FILE="fs/stat.c"
          
                    if grep -q "^int vfs_statx" "$STAT_FILE"; then
                      sed -i '/^int vfs_statx/i \
          #ifdef CONFIG_KSU\
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\
          #endif' "$STAT_FILE"
          
                      sed -i '/^int vfs_statx/,/struct path path/{
                        /struct path path/a \
          #ifdef CONFIG_KSU\
          \tksu_handle_stat(\&dfd, \&filename, \&flags);\
          #endif
                      }' "$STAT_FILE"
                    elif grep -q "^int vfs_fstatat" "$STAT_FILE"; then
                      sed -i '/^int vfs_fstatat/i \
          #ifdef CONFIG_KSU\
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\
          #endif' "$STAT_FILE"
          
                      sed -i '/^int vfs_fstatat/,/int error/{
                        /int error/a \
          #ifdef CONFIG_KSU\
          \tksu_handle_stat(\&dfd, \&filename, \&flag);\
          #endif
                      }' "$STAT_FILE"
                    fi
          
                    grep -n "ksu_handle_stat" "$STAT_FILE" && echo "✅ fs/stat.c patched" || echo "❌ fs/stat.c patch FAILED"
          
                    # ==========================================================
                    # PATCH 5: drivers/input/input.c - Safe Mode support
                    # ==========================================================
                    echo "--- Patching drivers/input/input.c ---"
                    INPUT_FILE="drivers/input/input.c"
          
                    sed -i '/^static void input_handle_event/i \
          #ifdef CONFIG_KSU\
          extern bool ksu_input_hook __read_mostly;\
          extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\
          #endif' "$INPUT_FILE"
          
                    sed -i '/^static void input_handle_event/,/int disposition/{
                      /int disposition = input_get_disposition/a \
          #ifdef CONFIG_KSU\
          \tif (unlikely(ksu_input_hook))\
          \t\tksu_handle_input_handle_event(\&type, \&code, \&value);\
          #endif
                    }' "$INPUT_FILE"
          
                    grep -n "ksu_handle_input_handle_event" "$INPUT_FILE" && echo "✅ drivers/input/input.c patched" || echo "❌ drivers/input/input.c patch FAILED"
          
                    # ==========================================================
                    # PATCH 6: fs/devpts/inode.c - Fix pm in terminal
                    # ==========================================================
                    echo "--- Patching fs/devpts/inode.c ---"
                    DEVPTS_FILE="fs/devpts/inode.c"
          
                    if [ -f "$DEVPTS_FILE" ]; then
                      sed -i '/^void \*devpts_get_priv/i \
          #ifdef CONFIG_KSU\
          extern int ksu_handle_devpts(struct inode*);\
          #endif' "$DEVPTS_FILE"
          
                      sed -i '/^void \*devpts_get_priv/,/DEVPTS_SUPER_MAGIC/{
                        /DEVPTS_SUPER_MAGIC/i \
          #ifdef CONFIG_KSU\
          \tksu_handle_devpts(dentry->d_inode);\
          #endif
            }' "$DEVPTS_FILE"

            grep -n "ksu_handle_devpts" "$DEVPTS_FILE" && echo "✅ fs/devpts/inode.c patched" || echo "❌ fs/devpts/inode.c patch FAILED"
          else
            echo "⚠️ fs/devpts/inode.c not found, skipping"
          fi

          echo ""
          echo "========== Manual hook patches complete =========="

      # ============================================================
      # 7. Fix touchscreen: change touch drivers from =m to =y
      # ============================================================
      - name: Fix touchscreen drivers (module to built-in)
        run: |
          cd kernel_source
          echo "========== Fixing touchscreen drivers =========="

          DEFCONFIG="arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}"
          if [ ! -f "$DEFCONFIG" ]; then
            DEFCONFIG="arch/arm64/configs/vendor/${{ github.event.inputs.KERNEL_DEFCONFIG }}"
          fi
          echo "Defconfig: $DEFCONFIG"

          echo ""
          echo "--- BEFORE: Touchscreen configs in defconfig ---"
          grep -i "touch\|fts\|focaltech\|goodix\|novatek\|nt36\|synaptics\|gt9" "$DEFCONFIG" || echo "(none found)"

          echo ""
          echo "--- Changing touchscreen drivers from =m to =y ---"

          # Common touchscreen driver config patterns for Xiaomi lisa (SM7325/Lahaina)
          TOUCH_PATTERNS=(
            "CONFIG_TOUCHSCREEN"
            "CONFIG_INPUT_TOUCHSCREEN"
            "CONFIG_FTS"
            "CONFIG_FOCALTECH"
            "CONFIG_GOODIX"
            "CONFIG_NOVATEK"
            "CONFIG_NT36"
            "CONFIG_SYNAPTICS"
            "CONFIG_GT9"
            "CONFIG_XIAOMI_TOUCH"
            "CONFIG_INPUT_MISC"
            "CONFIG_TOUCH_CORE"
          )

          CHANGED=0
          for PATTERN in "${TOUCH_PATTERNS[@]}"; do
            # Find lines with =m matching the pattern and switch to =y
            if grep -q "${PATTERN}.*=m" "$DEFCONFIG"; then
              echo "  🔧 Found ${PATTERN}=m → changing to =y"
              sed -i "s/${PATTERN}\(.*\)=m/${PATTERN}\1=y/g" "$DEFCONFIG"
              CHANGED=$((CHANGED + 1))
            fi
          done

          # Also do a broad sweep: any CONFIG with "TOUCH" or "FTS" or "FOCALTECH" set to =m
          if grep -qi "touch.*=m\|fts.*=m\|focaltech.*=m\|goodix.*=m\|novatek.*=m\|nt36.*=m\|synaptics.*=m" "$DEFCONFIG"; then
            echo "  🔧 Broad sweep: remaining touch-related =m entries"
            sed -i '/[Tt][Oo][Uu][Cc][Hh]/s/=m/=y/g' "$DEFCONFIG"
            sed -i '/[Ff][Tt][Ss]/s/=m/=y/g' "$DEFCONFIG"
            sed -i '/[Ff][Oo][Cc][Aa][Ll]/s/=m/=y/g' "$DEFCONFIG"
            sed -i '/[Gg][Oo][Oo][Dd][Ii][Xx]/s/=m/=y/g' "$DEFCONFIG"
            sed -i '/[Nn][Oo][Vv][Aa][Tt][Ee][Kk]/s/=m/=y/g' "$DEFCONFIG"
            sed -i '/[Nn][Tt]36/s/=m/=y/g' "$DEFCONFIG"
            sed -i '/[Ss][Yy][Nn][Aa][Pp]/s/=m/=y/g' "$DEFCONFIG"
            sed -i '/[Gg][Tt]9/s/=m/=y/g' "$DEFCONFIG"
            CHANGED=$((CHANGED + 1))
          fi

          echo ""
          echo "--- AFTER: Touchscreen configs in defconfig ---"
          grep -i "touch\|fts\|focaltech\|goodix\|novatek\|nt36\|synaptics\|gt9" "$DEFCONFIG" || echo "(none found)"

          echo ""
          echo "--- Listing touchscreen drivers in kernel source ---"
          ls drivers/input/touchscreen/ 2>/dev/null | head -30 || echo "Standard path not found"
          ls techpack/display/msm/dsi/ 2>/dev/null | head -10 || true

          if [ "$CHANGED" -gt 0 ]; then
            echo ""
            echo "✅ $CHANGED touchscreen config group(s) changed from =m to =y"
          else
            echo ""
            echo "ℹ️  No touchscreen configs with =m found in defconfig"
            echo "    Touch drivers may already be =y or not listed in defconfig"
            echo "    Will check .config after defconfig generation"
          fi

      # ============================================================
      # 8. Enable KPM support (if requested)
      # ============================================================
      - name: Enable KPM support
        if: ${{ github.event.inputs.ENABLE_KPM == 'true' }}
        run: |
          cd kernel_source
          DEFCONFIG="arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}"
          if [ ! -f "$DEFCONFIG" ]; then
            DEFCONFIG="arch/arm64/configs/vendor/${{ github.event.inputs.KERNEL_DEFCONFIG }}"
          fi
          echo "" >> "$DEFCONFIG"
          echo "# KPM support" >> "$DEFCONFIG"
          echo "CONFIG_KPM=y" >> "$DEFCONFIG"
          echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG"
          echo "✅ KPM configs added to defconfig"

      # ============================================================
      # 9. Disable LTO (if requested)
      # ============================================================
      - name: Disable LTO
        if: ${{ github.event.inputs.DISABLE_LTO == 'true' }}
        run: |
          cd kernel_source
          DEFCONFIG="arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}"
          if [ ! -f "$DEFCONFIG" ]; then
            DEFCONFIG="arch/arm64/configs/vendor/${{ github.event.inputs.KERNEL_DEFCONFIG }}"
          fi
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/' "$DEFCONFIG"
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/' "$DEFCONFIG"
          sed -i 's/CONFIG_THINLTO=y/# CONFIG_THINLTO is not set/' "$DEFCONFIG"
          echo "" >> "$DEFCONFIG"
          echo "# CONFIG_LTO is not set" >> "$DEFCONFIG"
          echo "# CONFIG_LTO_CLANG is not set" >> "$DEFCONFIG"
          echo "# CONFIG_THINLTO is not set" >> "$DEFCONFIG"
          echo "✅ LTO disabled in defconfig"

      # ============================================================
      # 10. Generate defconfig
      # ============================================================
      - name: Generate defconfig
        run: |
          cd kernel_source
          export PATH="$(pwd)/../toolchain/clang/bin:$PATH"
          make O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            ${{ github.event.inputs.KERNEL_DEFCONFIG }}
          echo "✅ Defconfig generated"

          echo ""
          echo "--- KSU config check in .config ---"
          grep "CONFIG_KSU" out/.config || echo "⚠️ CONFIG_KSU not found in .config"

          echo ""
          echo "--- Touchscreen config check in .config ---"
          grep -i "TOUCH\|FTS\|FOCALTECH\|GOODIX\|NOVATEK\|NT36\|SYNAPTICS\|GT9" out/.config | grep -v "^#" || echo "No touch configs enabled"

      # ============================================================
      # 11. Build kernel (FIXED: no tail -30, added KCFLAGS)
      # ============================================================
      - name: Build kernel
        run: |
          cd kernel_source
          echo "========== Building kernel =========="
          START_TIME=$(date +%s)

          export PATH="$(pwd)/../toolchain/clang/bin:$PATH"

          # KCFLAGS to suppress warnings-as-errors from newer Clang
          EXTRA_KCFLAGS="-Wno-error=enum-conversion \
            -Wno-error=enum-compare \
            -Wno-error=single-bit-bitfield-constant-conversion \
            -Wno-error=unused-variable \
            -Wno-error=sometimes-uninitialized \
            -Wno-error=format \
            -Wno-error=incompatible-pointer-types"

          make -j$(nproc) O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="$EXTRA_KCFLAGS" \
            Image 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          END_TIME=$(date +%s)
          ELAPSED=$(( END_TIME - START_TIME ))
          echo ""
          echo "========== Kernel build completed in ${ELAPSED}s =========="

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "✅ Kernel Image built successfully!"
            ls -lh out/arch/arm64/boot/Image
          else
            echo "❌ ERROR: Kernel Image not found!"
            echo ""
            echo "========== COMPILER ERRORS (first 50) =========="
            grep -i "error:" build.log | head -50 || true
            echo ""
            echo "========== LAST 50 LINES =========="
            tail -50 build.log || true
            echo ""
            ls -la out/arch/arm64/boot/ 2>/dev/null || true
            exit 1
          fi

      # ============================================================
      # 12. Download stock boot.img
      # ============================================================
      - name: Download stock boot.img
        run: |
          mkdir -p workdir
          wget -q -O workdir/stock_boot.img "${{ github.event.inputs.STOCK_BOOT_URL }}"
          ls -lh workdir/stock_boot.img
          echo "✅ Stock boot.img downloaded"

      # ============================================================
      # 13. Extract magiskboot from official Magisk APK
      # ============================================================
      - name: Setup magiskboot
        run: |
          cd workdir
          MAGISK_URL="https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk"
          wget -q -O Magisk.apk "$MAGISK_URL"
          unzip -o Magisk.apk lib/x86_64/libmagiskboot.so -d . || \
          unzip -o Magisk.apk lib/x86/libmagiskboot.so -d .
          MAGISKBOOT=$(find . -name "libmagiskboot.so" | head -1)
          cp "$MAGISKBOOT" ./magiskboot
          chmod +x ./magiskboot
          ./magiskboot 2>&1 | head -3 || true
          echo "✅ magiskboot ready"

      # ============================================================
      # 14. Repack boot.img with new kernel
      # ============================================================
      - name: Repack boot.img
        run: |
          cd workdir

          echo "========== Unpacking stock boot.img =========="
          ./magiskboot unpack -h stock_boot.img
          ls -la

          echo "========== Replacing kernel =========="
          cp ../kernel_source/out/arch/arm64/boot/Image kernel
          ls -lh kernel

          echo "========== Repacking boot.img =========="
          ./magiskboot repack stock_boot.img new_boot.img
          ls -lh new_boot.img
          echo "✅ boot.img repacked successfully!"

      # ============================================================
      # 15. Upload artifacts
      # ============================================================
      - name: Upload boot.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-sukisu-${{ github.run_number }}
          path: workdir/new_boot.img

      # ============================================================
      # 16. Create GitHub Release
      # ============================================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "SukiSU Kernel Build #${{ github.run_number }}"
          body: |
            ## SukiSU-Ultra Kernel Build (Manual Hook + Touch Fix)
            - **Kernel Source**: ${{ github.event.inputs.KERNEL_SOURCE }}
            - **Branch**: ${{ github.event.inputs.KERNEL_BRANCH }}
            - **Defconfig**: ${{ github.event.inputs.KERNEL_DEFCONFIG }}
            - **SukiSU Branch**: ${{ github.event.inputs.SUKISU_BRANCH }}
            - **Hook Method**: Manual Hook (CONFIG_KSU_MANUAL_HOOK=y)
            - **KPM Enabled**: ${{ github.event.inputs.ENABLE_KPM }}
            - **LTO Disabled**: ${{ github.event.inputs.DISABLE_LTO }}
            - **Touchscreen Fix**: Touch drivers built-in (=m → =y)
          files: workdir/new_boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
