name: Build Kernel with SukiSU-Ultra & Repack boot.img

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: "Kernel source repository URL"
        required: true
        default: "https://github.com/PixelExperience-Devices/kernel_xiaomi_lisa"
      KERNEL_BRANCH:
        description: "Kernel source branch"
        required: true
        default: "thirteen"
      KERNEL_DEFCONFIG:
        description: "Defconfig file"
        required: true
        default: "lisa_defconfig"
      SUKISU_BRANCH:
        description: "SukiSU-Ultra branch"
        required: true
        default: "main"
      ENABLE_KPM:
        description: "Enable KPM (Kernel Patch Module)"
        required: false
        default: true
        type: boolean
      DISABLE_LTO:
        description: "Disable LTO"
        required: false
        default: false
        type: boolean
      STOCK_BOOT_URL:
        description: "Stock boot.img URL for repacking"
        required: true
        default: "https://github.com/tungnt017/build-kernel-sukisu/releases/download/2.0/boot.img"

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel & Repack boot.img
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # ──────────────────────────────────────────────
      # 1. Checkout repository
      # ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────
      # 2. Install build dependencies
      # ──────────────────────────────────────────────
      - name: "📦 Install Dependencies"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3 \
            wget cpio

      # ──────────────────────────────────────────────
      # 3. Setup ccache for faster rebuilds
      # ──────────────────────────────────────────────
      - name: "🗃️ Setup ccache"
        run: |
          ccache -M 10G
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      # ──────────────────────────────────────────────
      # 4. Clone kernel source
      # ──────────────────────────────────────────────
      - name: "📥 Clone Kernel Source"
        run: |
          git clone --depth=1 \
            -b ${{ github.event.inputs.KERNEL_BRANCH }} \
            ${{ github.event.inputs.KERNEL_SOURCE }} \
            kernel_source

      # ──────────────────────────────────────────────
      # 5. Clone SukiSU-Ultra into kernel tree
      # ──────────────────────────────────────────────
      - name: "🌿 Clone SukiSU-Ultra"
        run: |
          cd kernel_source
          git clone --depth=1 \
            -b ${{ github.event.inputs.SUKISU_BRANCH }} \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git \
            KernelSU
          # Create symlink so the build system picks it up
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu
          # Register kernelsu in drivers Makefile
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

      # ──────────────────────────────────────────────
      # 6. Apply manual hook patches (NOT kprobe)
      # ──────────────────────────────────────────────
      - name: "🪩 Apply manual hook patches"
        working-directory: kernel_source
        run: |
          echo "🪩 Applying manual hook patches..."

          # --- fs/exec.c ---
          sed -i '/static int do_execveat_common/i \
          #ifdef CONFIG_KSU\n\
          extern bool ksu_execveat_hook __read_mostly;\n\
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,\n\
          \t\t\tvoid *envp, int *flags);\n\
          extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,\n\
          \t\t\t\t void *argv, void *envp, int *flags);\n\
          #endif' fs/exec.c

          sed -i '/int do_execveat_common/,/^{/{/^{/a \
          #ifdef CONFIG_KSU\n\
          \tif (unlikely(ksu_execveat_hook))\n\
          \t\tksu_handle_execveat(\&fd, \&filename, \&argv, \&envp, \&flags);\n\
          \telse\n\
          \t\tksu_handle_execveat_sucompat(\&fd, \&filename, \&argv, \&envp, \&flags);\n\
          #endif
          }' fs/exec.c

          # --- fs/open.c ---
          sed -i '/long do_faccessat/i \
          #ifdef CONFIG_KSU\n\
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,\n\
          \t\t\t int *flags);\n\
          #endif' fs/open.c

          sed -i '/long do_faccessat/,/^{/{/^{/a \
          #ifdef CONFIG_KSU\n\
          \tksu_handle_faccessat(\&dfd, \&filename, \&mode, NULL);\n\
          #endif
          }' fs/open.c

          # --- fs/read_write.c ---
          sed -i '/ssize_t vfs_read/i \
          #ifdef CONFIG_KSU\n\
          extern bool ksu_vfs_read_hook __read_mostly;\n\
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,\n\
          \t\t\tsize_t *count_ptr, loff_t **pos);\n\
          #endif' fs/read_write.c

          sed -i '/ssize_t vfs_read/,/^{/{/^{/a \
          #ifdef CONFIG_KSU\n\
          \tif (unlikely(ksu_vfs_read_hook))\n\
          \t\tksu_handle_vfs_read(\&file, \&buf, \&count, \&pos);\n\
          #endif
          }' fs/read_write.c

          # --- fs/stat.c ---
          sed -i '/int vfs_statx/i \
          #ifdef CONFIG_KSU\n\
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n\
          #endif' fs/stat.c

          sed -i '/int vfs_statx/,/^{/{/^{/a \
          #ifdef CONFIG_KSU\n\
          \tksu_handle_stat(\&dfd, \&filename, \&flags);\n\
          #endif
          }' fs/stat.c

          # --- drivers/input/input.c ---
          sed -i '/static void input_handle_event/i \
          #ifdef CONFIG_KSU\n\
          extern bool ksu_input_hook __read_mostly;\n\
          extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n\
          #endif' drivers/input/input.c

          sed -i '/int disposition = input_get_disposition/a \
          #ifdef CONFIG_KSU\n\
          \tif (unlikely(ksu_input_hook))\n\
          \t\tksu_handle_input_handle_event(\&type, \&code, \&value);\n\
          #endif' drivers/input/input.c

          # --- fs/devpts/inode.c ---
          sed -i '/void \*devpts_get_priv/i \
          #ifdef CONFIG_KSU\n\
          extern int ksu_handle_devpts(struct inode*);\n\
          #endif' fs/devpts/inode.c

          sed -i '/void \*devpts_get_priv/,/^{/{/^{/a \
          #ifdef CONFIG_KSU\n\
          \tksu_handle_devpts(dentry->d_inode);\n\
          #endif
          }' fs/devpts/inode.c

          echo "✅ Manual hook patches applied!"

      # ──────────────────────────────────────────────
      # 7. Setup defconfig (KSU, KPM, LTO)
      # ──────────────────────────────────────────────
      - name: "⚙️ Setup Defconfig"
        working-directory: kernel_source
        run: |
          DEFCONFIG="arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}"

          # Enable KSU with manual hook
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"

          # Enable KPM if requested
          if [ "${{ github.event.inputs.ENABLE_KPM }}" = "true" ]; then
            echo "[✓] Enabling KPM (Kernel Patch Module)..."
            echo "CONFIG_KPM=y" >> "$DEFCONFIG"
            echo "CONFIG_MODULES=y" >> "$DEFCONFIG"
            echo "CONFIG_MODULE_UNLOAD=y" >> "$DEFCONFIG"
          fi

          # Disable LTO if requested
          if [ "${{ github.event.inputs.DISABLE_LTO }}" = "true" ]; then
            echo "[✓] Disabling LTO..."
            sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' "$DEFCONFIG"
            sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' "$DEFCONFIG"
            sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' "$DEFCONFIG"
            echo "CONFIG_LTO_NONE=y" >> "$DEFCONFIG"
          fi

          echo "✅ Defconfig updated:"
          tail -20 "$DEFCONFIG"

      # ──────────────────────────────────────────────
      # 8. Setup Clang toolchain
      # ──────────────────────────────────────────────
      - name: "🔧 Setup Clang Toolchain"
        run: |
          mkdir -p ~/clang
          # Download AOSP Clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r498229b.tar.gz \
            -O ~/clang/clang.tar.gz || true

          # Fallback: use system clang + GCC cross-compiler
          if [ ! -f ~/clang/clang.tar.gz ] || [ ! -s ~/clang/clang.tar.gz ]; then
            echo "[*] Using system clang toolchain..."
            sudo apt-get install -y clang lld llvm
            echo "USE_SYSTEM_CLANG=true" >> $GITHUB_ENV
          else
            tar -xzf ~/clang/clang.tar.gz -C ~/clang/
            echo "USE_SYSTEM_CLANG=false" >> $GITHUB_ENV
          fi

          # GCC cross-compilers
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # ──────────────────────────────────────────────
      # 9. Build the kernel
      # ──────────────────────────────────────────────
      - name: "🔨 Build Kernel"
        working-directory: kernel_source
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          if [ "$USE_SYSTEM_CLANG" = "true" ]; then
            export CC=clang
            export LD=ld.lld
          else
            export PATH="$HOME/clang/bin:$PATH"
            export CC=clang
            export LD=ld.lld
          fi

          # Generate defconfig
          make O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            ${{ github.event.inputs.KERNEL_DEFCONFIG }}

          # Build kernel
          make O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            -j$(nproc --all)

          # Verify kernel image was built
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image" >> $GITHUB_ENV
            echo "[✓] Kernel Image built successfully!"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz" >> $GITHUB_ENV
            echo "[✓] Kernel Image.gz built successfully!"
          elif [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz-dtb" >> $GITHUB_ENV
            echo "[✓] Kernel Image.gz-dtb built successfully!"
          else
            echo "[✗] Kernel build failed! No Image found."
            ls -la out/arch/arm64/boot/ || true
            exit 1
          fi

      # ──────────────────────────────────────────────
      # 10. Download stock boot.img
      # ──────────────────────────────────────────────
      - name: "📥 Download Stock boot.img"
        run: |
          wget -q "${{ github.event.inputs.STOCK_BOOT_URL }}" -O stock_boot.img
          echo "[✓] Downloaded stock boot.img ($(stat -c%s stock_boot.img) bytes)"

      # ──────────────────────────────────────────────
      # 11. Download magiskboot (Linux x86_64)
      # ──────────────────────────────────────────────
# Extract magiskboot from official Magisk APK
      - name: Download magiskboot
        run: |
          MAGISK_VER="v30.7"
          wget -q "https://github.com/topjohnwu/Magisk/releases/download/${MAGISK_VER}/Magisk-${MAGISK_VER}.apk" -O magisk.apk
          unzip -jo magisk.apk "lib/x86_64/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          echo "[✓] magiskboot ${MAGISK_VER} ready"
          ./magiskboot || true

      # ──────────────────────────────────────────────
      # 12. Unpack stock boot.img
      # ──────────────────────────────────────────────
      - name: "📦 Unpack Stock boot.img"
        run: |
          mkdir -p workdir
          cp stock_boot.img workdir/
          cp magiskboot workdir/
          cd workdir

          ./magiskboot unpack stock_boot.img
          echo ""
          echo "[✓] Unpacked boot.img components:"
          ls -la

      # ──────────────────────────────────────────────
      # 13. Replace kernel in unpacked boot
      # ──────────────────────────────────────────────
      - name: "🔄 Replace Kernel"
        run: |
          cd workdir

          # Back up original kernel
          if [ -f kernel ]; then
            cp kernel kernel.orig
            echo "[*] Original kernel size: $(stat -c%s kernel) bytes"
          fi

          # Copy newly built kernel image
          cp ../kernel_source/${{ env.KERNEL_IMAGE }} kernel
          echo "[✓] Replaced kernel with custom SukiSU-Ultra build ($(stat -c%s kernel) bytes)"

      # ──────────────────────────────────────────────
      # 14. Repack boot.img using magiskboot
      # ──────────────────────────────────────────────
      - name: "📦 Repack boot.img"
        run: |
          cd workdir

          ./magiskboot repack stock_boot.img new-boot.img
          echo ""
          echo "[✓] Repacked boot.img successfully!"
          echo "    Original: $(stat -c%s stock_boot.img) bytes"
          echo "    New:      $(stat -c%s new-boot.img) bytes"

          # Copy to workspace root for artifact upload
          cp new-boot.img ../new-boot.img

      # ──────────────────────────────────────────────
      # 15. Upload boot.img as GitHub Actions artifact
      # ──────────────────────────────────────────────
      - name: "💾 Upload boot.img Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: boot-img-sukisu-${{ github.run_number }}
          path: new-boot.img
          retention-days: 7

      # ──────────────────────────────────────────────
      # 16. Create GitHub Release with the new boot.img
      # ──────────────────────────────────────────────
      - name: "🏷️ Generate Release Tag"
        run: |
          echo "RELEASE_TAG=v$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
          echo "RELEASE_DATE=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: "🚀 Create Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "SukiSU-Ultra Kernel Boot Image - ${{ env.RELEASE_DATE }}"
          body: |
            ## 🔧 Build Configuration
            | Setting | Value |
            |---------|-------|
            | **Kernel Source** | `${{ github.event.inputs.KERNEL_SOURCE }}` |
            | **Branch** | `${{ github.event.inputs.KERNEL_BRANCH }}` |
            | **Defconfig** | `${{ github.event.inputs.KERNEL_DEFCONFIG }}` |
            | **SukiSU Branch** | `${{ github.event.inputs.SUKISU_BRANCH }}` |
            | **Hook Method** | `manual` |
            | **KPM Enabled** | `${{ github.event.inputs.ENABLE_KPM }}` |
            | **LTO Disabled** | `${{ github.event.inputs.DISABLE_LTO }}` |
            | **Stock boot.img** | `${{ github.event.inputs.STOCK_BOOT_URL }}` |

            ## 📦 Files
            - `new-boot.img` — Repacked boot image with SukiSU-Ultra kernel (manual hook)

            ## 🚀 Flash Instructions
            ```bash
            fastboot flash boot new-boot.img
            ```
          files: new-boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
